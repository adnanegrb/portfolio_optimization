[project]
name = "portfolio-optimization"
version = "0.1.0"
description = "Markowitz mean-variance optimizer and Value at Risk engine for equity portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "yfinance>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
